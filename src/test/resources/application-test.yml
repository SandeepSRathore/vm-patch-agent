spring:
  datasource:
    url: jdbc:h2:mem:agent-${random.uuid};DB_CLOSE_DELAY=-1
agent:
  scheduling:
    enabled: false
  scripts:
    mode: demo
  feeds:
    sync-on-scan: false
    # Nothing in tests may reach the real feeds.
    msrc:
      base-url: http://127.0.0.1:9/msrc
    nvd:
      base-url: http://127.0.0.1:9/nvd
    kev:
      url: http://127.0.0.1:9/kev.json
  security:
    mode: demo
    max-failed-sign-ins: 3
    demo-users:
      - username: admin
        password: admin-pass
        group-sids: [S-1-5-32-544]
      - username: user
        password: user-pass
        group-sids: [S-1-5-32-545]
  vsphere:
    mode: fake
